        需要当前会话和旧密码；修改成功后撤销全部终端登录。

        契约状态：FROZEN；实现状态：IMPLEMENTED_UNVERIFIED。 认证：需要 webSession Cookie。 需要 X-CSRF-TOKEN。 已知限制：尚无与本次发布提交对应的受控 Dev 请求证据。 验证：已完成本地规范与实例校验；真实 Dev 请求尚未核验
