              schema:
                "$ref": "#/components/schemas/Response"
          description: 申请已过期、状态冲突或幂等冲突
        '503':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: 会话存储暂不可用
