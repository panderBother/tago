          description: 密码修改成功
        '400':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: 请求参数无效
        '401':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: 未登录或会话已失效
        '403':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: CSRF 令牌无效或无权访问
        '429':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: 登录尝试超过限流窗口
        '503':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Response"
          description: 身份存储暂不可用
      security:
      - webSession: []
      summary: 修改当前账号密码
      tags:
      - 身份认证
      x-tago: &10
        contractStatus: FROZEN
        implementationStatus: IMPLEMENTED_UNVERIFIED
        owner: contract-owner
        knownGaps:
