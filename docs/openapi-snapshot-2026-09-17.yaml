          example: '123456'
          maxLength: 6
          minLength: 6
          pattern: "^[0-9]{6}$"
          type: string
        email:
          description: 邮箱地址；去首尾空白并规范化后长度为 6–254 个字符
          example: user@example.com
          format: email
          maxLength: 320
          minLength: 6
          type: string
        password:
          description: 新密码；业务有效长度为 8–128 个 Unicode 码点
          format: password
          maxLength: 256
          minLength: 8
          type: string
