components:
  schemas:
    AcceptanceView:
      description: 申请接受后的连接结果
      properties:
        applicationId:
          format: uuid
          type: string
        conversationId:
          format: uuid
          type: string
        encounterId:
          format: uuid
          type: string
      required:
      - applicationId
      - conversationId
      - encounterId
      type: object
    Answer:
      description: 申请者对一个问题的回答
      properties:
        questionVersion:
          format: int64
          minimum: 0
          type: integer
        slot:
          format: int32
          maximum: 3
          minimum: 1
          type: integer
        text:
          maxLength: 2000
          minLength: 1
          type: string
      required:
      - questionVersion
      - slot
      - text
      type: object
    AnswerView:
      description: 申请快照中的答案
      properties:
        party:
          enum:
          - PUBLISHER
          - APPLICANT
          type: string
        slot:
          format: int32
          maximum: 3
          minimum: 1
          type: integer
        text:
          maxLength: 2000
          minLength: 1
          type: string
      required:
      - party
      - slot
      - text
      type: object
    ApplicationPage:
      type: object
      required:
      - items
      - nextCursor
      - hasMore
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationView"
        nextCursor:
          oneOf:
          - type: string
            minLength: 1
          - type: 'null'
        hasMore:
          type: boolean
    ApplicationView:
      description: 认识申请及提交时的不可变快照
      properties:
        acceptsUntil:
          format: date-time
          type: string
        applicantAnswers:
          items:
            "$ref": "#/components/schemas/AnswerView"
          type: array
          minItems: 3
          maxItems: 3
        applicantId:
          format: uuid
          type: string
        applicantIdentity:
          "$ref": "#/components/schemas/PublicIdentityView"
        conversationId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        encounterId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        id:
          format: uuid
          type: string
        publisherAnswers:
          items:
            "$ref": "#/components/schemas/AnswerView"
          type: array
          minItems: 3
          maxItems: 3
        publisherId:
          format: uuid
          type: string
        publisherIdentity:
          "$ref": "#/components/schemas/PublicIdentityView"
        questions:
          items:
            "$ref": "#/components/schemas/QuestionSnapshotView"
          type: array
          minItems: 3
          maxItems: 3
        state:
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
