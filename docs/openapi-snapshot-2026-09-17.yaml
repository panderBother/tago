  "/api/v1/applications/{applicationId}/accept":
    post:
      description: |-
        只有发布者可以接受；同一申请重复接受返回原会话和相遇结果。

        契约状态：FROZEN；实现状态：IMPLEMENTED_WITH_GAPS。 认证：需要 webSession Cookie。 需要 X-CSRF-TOKEN。 需要 Idempotency-Key；同键重放保持原响应，内容不同返回 IDEMPOTENCY_CONFLICT。 已知限制：会话与相遇创建的真实幂等结果需要 Dev/集成证据。 验证：已完成本地规范与实例校验；真实 Dev 请求尚未核验
      operationId: acceptIntroductionApplication
      parameters:
      - description: 使用 GET /api/v1/auth/csrf 返回的 data.token。
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
          minLength: 1
      - description: Application ID
        in: path
        name: applicationId
        required: true
        schema:
          format: uuid
          type: string
      - description: 相同请求回放原响应；不同请求内容返回 IDEMPOTENCY_CONFLICT。最大 128 个字符。
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 128
      responses:
